<!DOCTYPE html>
<html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe</title>
        <link rel="stylesheet" href="tictactoe.css">
    </head>
    <body>
        <div class="game-layout">
            <img src="spongeBob.png" alt aria-hidden="true" loading="eager" decoding="async" fetchpriority="high" class="spb">
            
            <div class="container">
                <h1>Tic Tac Toe</h1>
                <div class="board">
                    <div cellIndex="0" class="cell"></div>
                    <div cellIndex="1" class="cell"></div>
                    <div cellIndex="2" class="cell"></div>
                    <div cellIndex="3" class="cell"></div>
                    <div cellIndex="4" class="cell"></div>
                    <div cellIndex="5" class="cell"></div>
                    <div cellIndex="6" class="cell"></div>
                    <div cellIndex="7" class="cell"></div>
                    <div cellIndex="8" class="cell"></div>
                </div>
                <button id="start-button">Restart</button>
                <div id="result"></div>
            </div>
            
            <img src="patrik.png" alt aria-hidden="true" loading="eager" decoding="async" fetchpriority="high" class="ptk">
            
            <script src="tictactoe.js"></script>
        </div>
    </body>
</html>
